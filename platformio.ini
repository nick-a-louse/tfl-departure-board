; PlatformIO Project Configuration File
;
; Board confirmed as DFRobot FireBeetle 2 ESP32-E (same hardware/pinout as the
; Weather_Picture_Frame project). Platform/library versions are pinned to match
; that project's already-verified-working combination on this machine.

[env:dfrobot_firebeetle2_esp32e]
platform = espressif32 @ 6.12.0
board = dfrobot_firebeetle2_esp32e
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags = -Wall -std=gnu++17
lib_deps =
    zinggjm/GxEPD2 @ 1.6.5
    bblanchon/ArduinoJson @ 7.4.2
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
